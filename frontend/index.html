
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>House Price Prediction</h1>
        <p>Enter the house details to estimate its price.</p>

        <form id="prediction-form">
            <label for="area">Area (square feet)</label>
            <input type="number" id="area" min="1" required>

            <label for="bedrooms">Bedrooms</label>
            <input type="number" id="bedrooms" min="1" max="20" required>

            <label for="age">House Age (years)</label>
            <input type="number" id="age" min="0" max="200" required>

            <button type="submit" id="predict-button">
                Predict Price
            </button>
        </form>

        <p id="status" role="status"></p>
        <section id="result" hidden>
            <h2>Predicted Price</h2>
            <p id="price"></p>
            <small>This is a model estimate, not a property valuation.</small>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
